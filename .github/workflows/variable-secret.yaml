name: Environment Variables

on: push

env:
    CONTAINER_REGISTRY: docker.io
    #DOCKER_USERNAME: cmsingh007
    IMAGE_NAME: github-actions-nginx

jobs:

    docker:
        # env:
        #     CONTAINER_REGISTRY: docker.io
        #     #DOCKER_USERNAME: cmsingh007
        #     IMAGE_NAME: github-actions-nginx
        runs-on: ubuntu-latest
        steps:
            - name: Docker Build
              run: echo docker build -d ${{env.CONTAINER_REGISTRY}}/${{ vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest

            - name: Docker Login
              #env:
                #DOCKER_PASSWORD: secure
              run: echo docker login --username=${{ vars.DOCKER_USERNAME}} --password=${{ secrets.DOCKER_PASSWORD }}
            
            - name: Docker Publish
              run: echo docker push $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest

    deploy:
        # env:
        #     CONTAINER_REGISTRY: docker.io
        #     DOCKER_USERNAME: cmsingh007
        #     IMAGE_NAME: github-actions-nginx
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - name: Docker Run
              run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest
